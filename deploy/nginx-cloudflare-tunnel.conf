# Dikelola oleh LocalPanel: dukungan Cloudflare Tunnel
# IP pengunjung asli (cloudflared menyambung dari localhost)
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# Beri tahu PHP bahwa pengunjung memakai HTTPS (SSL ditangani Cloudflare)
map $http_x_forwarded_proto $lp_https {
    default "";
    https   on;
}
