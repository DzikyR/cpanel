# Dikelola oleh LocalPanel: variabel untuk proxy aplikasi Node.js
# WebSocket: teruskan header Upgrade bila ada
map $http_upgrade $lp_connection_upgrade {
    default upgrade;
    ''      '';
}

# Protokol asli pengunjung (https bila lewat Cloudflare Tunnel)
map $http_x_forwarded_proto $lp_forwarded_proto {
    default $scheme;
    https   https;
}
