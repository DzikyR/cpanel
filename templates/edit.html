{% extends "base.html" %}{% block title %}Edit File{% endblock %}{% block content %}
<div class="card"><p><code>/var/www/{{ rel }}</code> · <a href="/files?p={{ parent|urlencode }}">← kembali</a></p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="p" value="{{ rel }}">
<textarea name="content" spellcheck="false" style="width:100%;height:65vh;font-family:ui-monospace,Consolas,monospace;font-size:13px">{{ content }}</textarea>
<p><button>💾 Simpan</button></p></form></div>
{% endblock %}
